{% extends "base.html" %}
{% block title %}Register - StreamHub{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create your account</h1>
    <p>Join StreamHub and start sharing videos.</p>
    <form method="post">
        <label>Username</label>
        <input type="text" name="username" minlength="3" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" minlength="6" required>
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" minlength="6" required>
        <button class="button full" type="submit">Create Account</button>
    </form>
    <p class="center">Already registered? <a href="{{ url_for('main.login') }}">Login</a></p>
</div>
{% endblock %}
