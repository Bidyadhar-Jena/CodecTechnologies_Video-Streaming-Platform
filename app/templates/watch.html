{% extends "base.html" %}
{% block title %}{{ video.title }} — StreamHub{% endblock %}
{% block content %}
<div class="watch">
  <a class="back" href="{{ url_for('main.index') }}">← Back to videos</a>
  <video class="player" controls preload="metadata">
    <source src="{{ url_for('main.media', filename=video.filename) }}">
    Your browser does not support HTML5 video.
  </video>
  <h1>{{ video.title }}</h1>
  <div class="meta">{{ video.views }} views · {{ video.uploaded_at }}</div>
  {% if video.description %}<p class="description">{{ video.description }}</p>{% endif %}
</div>
{% endblock %}
